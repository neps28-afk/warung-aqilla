<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warung Aqilla POS & Kasir</title>
  
  <!-- SVG Favicon Warung Aqilla -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%2310b981' d='M256 0c17.7 0 32 14.3 32 32V64H448c17.7 0 32 14.3 32 32s-14.3 32-32 32H64C46.3 128 32 113.7 32 96S46.3 64 64 64H224V32c0-17.7 14.3-32 32-32zM32 192H480V448c0 35.3-28.7 64-64 64H96c-35.3 0-64-28.7-64-64V192zm160 80c0-8.8-7.2-16-16-16s-16 7.2-16 16v96c0 8.8 7.2 16 16 16s16-7.2 16-16V272zm112 0c0-8.8-7.2-16-16-16s-16 7.2-16 16v96c0 8.8 7.2 16 16 16s16-7.2 16-16V272z'/></svg>" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone Compiler CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <!-- React Application Core Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Official Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDVQOo1XmfacvFbCO5TW_RJ21vg270oii0",
      authDomain: "warung-aqilla.firebaseapp.com",
      projectId: "warung-aqilla",
      storageBucket: "warung-aqilla.firebasestorage.app",
      messagingSenderId: "766735283911",
      appId: "1:766735283911:web:628f8fc7b3747a193630e2",
      measurementId: "G-QQVWKBK541"
    };

    let db = null;
    let auth = null;
    let isFirebaseReady = false;

    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      auth = firebase.auth();
      db = firebase.firestore();
      isFirebaseReady = true;
    } catch (e) {
      console.warn("Firebase initialization warning (Fallback mode active):", e);
    }

    const DEFAULT_PRODUCTS = [
      { id: '1', sku: 'PRD-001', name: 'Beras Premium 5kg', category: 'Sembako', buyPrice: 60000, sellPrice: 68000, stock: 15 },
      { id: '2', sku: 'PRD-002', name: 'Minyak Goreng 2L', category: 'Sembako', buyPrice: 28000, sellPrice: 32000, stock: 20 },
      { id: '3', sku: 'PRD-003', name: 'Gula Pasir 1kg', category: 'Sembako', buyPrice: 14000, sellPrice: 16000, stock: 25 },
      { id: '4', sku: 'PRD-004', name: 'Telur Ayam 1kg', category: 'Sembako', buyPrice: 26000, sellPrice: 29000, stock: 30 },
      { id: '5', sku: 'PRD-005', name: 'Kopi Kapal Api 165g', category: 'Minuman', buyPrice: 12000, sellPrice: 14500, stock: 18 },
      { id: '6', sku: 'PRD-006', name: 'Teh Celup Sariwangi', category: 'Minuman', buyPrice: 6500, sellPrice: 8000, stock: 40 },
      { id: '7', sku: 'PRD-007', name: 'Mie Goreng Indomie', category: 'Makanan', buyPrice: 2800, sellPrice: 3500, stock: 100 },
      { id: '8', sku: 'PRD-008', name: 'Susu Kental Manis', category: 'Minuman', buyPrice: 10000, sellPrice: 12000, stock: 12 }
    ];

    const DEFAULT_CATEGORIES = ['Sembako', 'Makanan', 'Minuman', 'Bumbu', 'Umum'];
    const DEFAULT_ADMINS = [{ id: 'admin-1', username: 'admin', password: 'admin123' }];
    const DEFAULT_SETTINGS = {
      id: 'store_settings',
      name: 'Warung Aqilla',
      address: 'Jl. Raya Utama No. 123, Jakarta',
      phone: '081234567890',
      paperWidth: '58mm',
      footerMsg: 'Terima kasih atas kunjungan Anda!\nBarang yang sudah dibeli tidak dapat ditukar/dikembalikan.'
    };

    const formatRupiah = (amount) => {
      return 'Rp ' + Math.floor(amount || 0).toLocaleString('id-ID');
    };

    const formatWAPhone = (phone) => {
      if (!phone) return '';
      let clean = phone.replace(/[^0-9]/g, '');
      if (clean.startsWith('0')) {
        return '62' + clean.slice(1);
      }
      return clean;
    };

    function App() {
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [activeTab, setActiveTab] = useState('pos');

      // Main Data Collections
      const [products, setProducts] = useState(DEFAULT_PRODUCTS);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [transactions, setTransactions] = useState([]);
      const [adminUsers, setAdminUsers] = useState(DEFAULT_ADMINS);
      const [settings, setSettings] = useState(DEFAULT_SETTINGS);
      const [opnameLogs, setOpnameLogs] = useState([]);

      // Shopping Cart
      const [cart, setCart] = useState([]);
      const [custName, setCustName] = useState('');
      const [custNote, setCustNote] = useState('');

      // Search and Filter States
      const [selectedCategory, setSelectedCategory] = useState('Semua');
      const [posSearch, setPosSearch] = useState('');
      const [productSearch, setProductSearch] = useState('');
      const [prodCategoryFilter, setProdCategoryFilter] = useState('Semua');
      const [txMonthFilter, setTxMonthFilter] = useState('');

      // Page Limit States
      const [prodLimit, setProdLimit] = useState('20');
      const [opnameLimit, setOpnameLimit] = useState('20');
      const [txLimit, setTxLimit] = useState('20');
      const [topProdLimit, setTopProdLimit] = useState('5');

      // Financial Reports Period Filters
      const [reportPeriod, setReportPeriod] = useState('all'); // 'all', 'monthly', 'yearly'
      const [reportMonth, setReportMonth] = useState(new Date().toISOString().slice(0, 7));
      const [reportYear, setReportYear] = useState(new Date().getFullYear().toString());

      // Opname State
      const [opnameSubTab, setOpnameSubTab] = useState('live'); // 'live', 'archive'
      const [opnamePhysical, setOpnamePhysical] = useState({});
      const [opnameNotes, setOpnameNotes] = useState({});

      // Modals
      const [isLoginModalOpen, setIsLoginModalOpen] = useState(false);
      const [isPayModalOpen, setIsPayModalOpen] = useState(false);
      const [isProductModalOpen, setIsProductModalOpen] = useState(false);
      const [isRestockModalOpen, setIsRestockModalOpen] = useState(false);
      const [isCategoryModalOpen, setIsCategoryModalOpen] = useState(false);
      const [isReceiptModalOpen, setIsReceiptModalOpen] = useState(false);
      
      // Custom Delete Confirmation Modal State
      const [deleteModal, setDeleteModal] = useState({
        isOpen: false,
        title: '',
        message: '',
        onConfirm: null
      });

      // Password Toggle States
      const [showLoginPassword, setShowLoginPassword] = useState(false);
      const [showAdminPassword, setShowAdminPassword] = useState(false);

      // Specific Modal Forms
      const [loginInput, setLoginInput] = useState({ username: '', password: '' });
      const [selectedPayMethod, setSelectedPayMethod] = useState('Tunai');
      const [cashAmount, setCashAmount] = useState('');
      const [editingProd, setEditingProd] = useState(null);
      const [restockProd, setRestockProd] = useState(null);
      const [restockQty, setRestockQty] = useState('');
      const [newCatInput, setNewCatInput] = useState('');
      const [currentTxToPrint, setCurrentTxToPrint] = useState(null);
      const [activePendingTxId, setActivePendingTxId] = useState(null);
      const [pendingTargetTab, setPendingTargetTab] = useState(null);

      // Admin & Settings Forms
      const [adminForm, setAdminForm] = useState({ index: -1, username: '', password: '' });
      const [settingsForm, setSettingsForm] = useState(DEFAULT_SETTINGS);

      // Toast Notifications
      const [toast, setToast] = useState({ show: false, message: '', isError: false });

      useEffect(() => {
        if (!isFirebaseReady || !db || !auth) return;

        let unsubProducts = () => {};
        let unsubCategories = () => {};
        let unsubTx = () => {};
        let unsubSettings = () => {};
        let unsubAdmins = () => {};
        let unsubOpname = () => {};

        const unsubAuth = auth.onAuthStateChanged(user => {
          if (!user) {
            auth.signInAnonymously().catch(err => console.warn("Anon Auth Error:", err));
            return;
          }

          // Listener 1: Products
          unsubProducts = db.collection('products').onSnapshot(
            snap => {
              if (!snap.empty) {
                const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                setProducts(list);
              } else {
                DEFAULT_PRODUCTS.forEach(p => db.collection('products').doc(p.id).set(p).catch(() => {}));
              }
            },
            err => console.warn("Firestore Products permission warning:", err.message)
          );

          // Listener 2: Categories
          unsubCategories = db.collection('categories').onSnapshot(
            snap => {
              if (!snap.empty) {
                const cats = snap.docs.map(doc => doc.data().name);
                setCategories(cats);
              } else {
                DEFAULT_CATEGORIES.forEach(c => db.collection('categories').doc(c).set({ name: c }).catch(() => {}));
              }
            },
            err => console.warn("Firestore Categories permission warning:", err.message)
          );

          // Listener 3: Transactions
          unsubTx = db.collection('transactions').onSnapshot(
            snap => {
              const list = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              list.sort((a, b) => new Date(b.date) - new Date(a.date));
              setTransactions(list);
            },
            err => console.warn("Firestore Transactions permission warning:", err.message)
          );

          // Listener 4: Settings
          unsubSettings = db.collection('settings').doc('store_settings').onSnapshot(
            doc => {
              if (doc.exists) {
                setSettings(doc.data());
                setSettingsForm(doc.data());
              } else {
                db.collection('settings').doc('store_settings').set(DEFAULT_SETTINGS).catch(() => {});
              }
            },
            err => console.warn("Firestore Settings permission warning:", err.message)
          );

          // Listener 5: Admin Users
          unsubAdmins = db.collection('admins').onSnapshot(
            snap => {
              if (!snap.empty) {
                const admins = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                setAdminUsers(admins);
              } else {
                DEFAULT_ADMINS.forEach(a => db.collection('admins').doc(a.id).set(a).catch(() => {}));
              }
            },
            err => console.warn("Firestore Admins permission warning:", err.message)
          );

          // Listener 6: Opname Logs
          unsubOpname = db.collection('opname_logs').onSnapshot(
            snap => {
              const logs = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              logs.sort((a, b) => new Date(b.date) - new Date(a.date));
              setOpnameLogs(logs);
            },
            err => console.warn("Firestore Opname permission warning:", err.message)
          );
        });

        return () => {
          unsubAuth();
          unsubProducts();
          unsubCategories();
          unsubTx();
          unsubSettings();
          unsubAdmins();
          unsubOpname();
        };
      }, []);

      const showToast = (message, isError = false) => {
        setToast({ show: true, message, isError });
        setTimeout(() => {
          setToast({ show: false, message: '', isError: false });
        }, 3000);
      };

      const openDeleteModal = (title, message, onConfirmCallback) => {
        setDeleteModal({
          isOpen: true,
          title,
          message,
          onConfirm: () => {
            onConfirmCallback();
            setDeleteModal({ isOpen: false, title: '', message: '', onConfirm: null });
          }
        });
      };

      const switchTab = (tabId) => {
        const protectedTabs = ['pending', 'products', 'opname', 'history', 'reports', 'settings'];
        if (protectedTabs.includes(tabId) && !isAdminLoggedIn) {
          setPendingTargetTab(tabId);
          setIsLoginModalOpen(true);
          showToast('Akses terbatas! Silakan Login Admin.', true);
          return;
        }
        setActiveTab(tabId);
      };

      const toggleAdminAuth = () => {
        if (isAdminLoggedIn) {
          setIsAdminLoggedIn(false);
          switchTab('pos');
          showToast('Logout Admin berhasil.');
        } else {
          setIsLoginModalOpen(true);
        }
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        const matched = adminUsers.find(
          u => u.username.toLowerCase() === loginInput.username.trim().toLowerCase() && u.password === loginInput.password.trim()
        );

        if (matched) {
          setIsAdminLoggedIn(true);
          setIsLoginModalOpen(false);
          setCart([]);
          setLoginInput({ username: '', password: '' });
          setShowLoginPassword(false);
          showToast(`Selamat datang, ${matched.username}!`);
          if (pendingTargetTab) {
            const target = pendingTargetTab;
            setPendingTargetTab(null);
            setActiveTab(target);
          } else {
            setActiveTab('pos');
          }
        } else {
          showToast('Username atau Password Admin salah!', true);
        }
      };

      const addToCart = (product) => {
        const cartItem = cart.find(i => i.id === product.id);
        const currentQty = cartItem ? cartItem.qty : 0;

        if (currentQty >= product.stock) {
          showToast('Stok barang tidak mencukupi!', true);
          return;
        }

        if (cartItem) {
          setCart(cart.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i));
        } else {
          setCart([...cart, {
            id: product.id,
            sku: product.sku,
            name: product.name,
            buyPrice: product.buyPrice,
            sellPrice: product.sellPrice,
            qty: 1
          }]);
        }
      };

      const updateCartQty = (productId, delta) => {
        const prod = products.find(p => p.id === productId);
        const cartItem = cart.find(i => i.id === productId);
        if (!cartItem) return;

        if (delta > 0) {
          if (prod && cartItem.qty >= prod.stock) {
            showToast('Stok barang tidak mencukupi!', true);
            return;
          }
          setCart(cart.map(i => i.id === productId ? { ...i, qty: i.qty + 1 } : i));
        } else {
          if (cartItem.qty <= 1) {
            setCart(cart.filter(i => i.id !== productId));
          } else {
            setCart(cart.map(i => i.id === productId ? { ...i, qty: i.qty - 1 } : i));
          }
        }
      };

      const removeFromCart = (productId) => {
        setCart(cart.filter(i => i.id !== productId));
      };

      const clearCart = () => {
        setCart([]);
        setCustName('');
        setCustNote('');
      };

      const submitOrderWA = () => {
        if (cart.length === 0) {
          showToast('Keranjang belanja masih kosong!', true);
          return;
        }
        if (!custName.trim()) {
          showToast('Silakan isi Nama Pelanggan!', true);
          return;
        }

        const totalPrice = cart.reduce((sum, item) => sum + (item.sellPrice * item.qty), 0);
        const totalBuyPrice = cart.reduce((sum, item) => sum + (item.buyPrice * item.qty), 0);
        const profit = totalPrice - totalBuyPrice;

        // Deduct stock in Firestore & local
        const updatedProducts = products.map(p => {
          const cartItem = cart.find(c => c.id === p.id);
          if (cartItem) {
            const newStk = Math.max(0, p.stock - cartItem.qty);
            if (isFirebaseReady && db) {
              db.collection('products').doc(p.id).update({ stock: newStk }).catch(e => console.warn("Stock update error:", e));
            }
            return { ...p, stock: newStk };
          }
          return p;
        });
        setProducts(updatedProducts);

        const txId = 'TRX-' + Date.now().toString().slice(-6);
        const newTx = {
          id: txId,
          date: new Date().toISOString(),
          customerName: custName.trim(),
          customerNote: custNote.trim(),
          items: cart,
          totalPrice,
          profit,
          paymentMethod: 'WhatsApp',
          cashReceived: 0,
          changeAmount: 0,
          status: 'Belum Bayar'
        };

        if (isFirebaseReady && db) {
          db.collection('transactions').doc(txId).set(newTx).catch(e => console.warn("Tx write error:", e));
        } else {
          setTransactions([newTx, ...transactions]);
        }

        const storePhoneFormatted = formatWAPhone(settings.phone);
        let waText = `*HALO ${(settings.name || 'WARUNG AQILLA').toUpperCase()}*\n`;
        waText += `Saya ingin memesan produk berikut:\n\n`;
        waText += `*Detail Pelanggan:*\n`;
        waText += `- Nama: ${custName.trim()}\n`;
        if (custNote.trim()) waText += `- Catatan: ${custNote.trim()}\n`;
        waText += `\n*Daftar Pesanan:*\n`;

        cart.forEach(item => {
          waText += `• ${item.name} (${item.qty}x) = ${formatRupiah(item.sellPrice * item.qty)}\n`;
        });

        waText += `\n*TOTAL TAGIHAN: ${formatRupiah(totalPrice)}*\n`;
        waText += `No. Pesanan: ${txId}\n\n`;
        waText += `Mohon konfirmasi ketersediaan dan cara pembayarannya. Terima kasih!`;

        const encodedText = encodeURIComponent(waText);
        const waUrl = storePhoneFormatted ? `https://wa.me/${storePhoneFormatted}?text=${encodedText}` : `https://wa.me/?text=${encodedText}`;

        window.open(waUrl, '_blank');
        clearCart();
        showToast('Pesanan berhasil dikirim ke WhatsApp!');
      };

      const openPaymentModal = () => {
        if (cart.length === 0) {
          showToast('Keranjang belanja masih kosong!', true);
          return;
        }
        setSelectedPayMethod('Tunai');
        setCashAmount('');
        setIsPayModalOpen(true);
      };

      const processTransaction = () => {
        const totalPrice = cart.reduce((sum, item) => sum + (item.sellPrice * item.qty), 0);
        const totalBuyPrice = cart.reduce((sum, item) => sum + (item.buyPrice * item.qty), 0);
        const profit = totalPrice - totalBuyPrice;

        let cashReceivedNum = 0;
        let changeAmount = 0;

        if (selectedPayMethod === 'Tunai') {
          cashReceivedNum = parseFloat(cashAmount) || 0;
          if (cashReceivedNum < totalPrice) {
            showToast('Jumlah uang tunai diterima kurang!', true);
            return;
          }
          changeAmount = cashReceivedNum - totalPrice;
        } else {
          cashReceivedNum = totalPrice;
          changeAmount = 0;
        }

        let tx;
        if (activePendingTxId) {
          tx = transactions.find(t => t.id === activePendingTxId);
          if (tx) {
            tx = {
              ...tx,
              status: 'Lunas',
              paymentMethod: selectedPayMethod,
              cashReceived: cashReceivedNum,
              changeAmount,
              date: new Date().toISOString()
            };
          }
        } else {
          const updatedProducts = products.map(p => {
            const cartItem = cart.find(c => c.id === p.id);
            if (cartItem) {
              const newStk = Math.max(0, p.stock - cartItem.qty);
              if (isFirebaseReady && db) {
                db.collection('products').doc(p.id).update({ stock: newStk }).catch(e => console.warn("Stock update error:", e));
              }
              return { ...p, stock: newStk };
            }
            return p;
          });
          setProducts(updatedProducts);

          tx = {
            id: 'TRX-' + Date.now().toString().slice(-6),
            date: new Date().toISOString(),
            customerName: 'Pelanggan Kasir',
            customerNote: '',
            items: [...cart],
            totalPrice,
            profit,
            paymentMethod: selectedPayMethod,
            cashReceived: cashReceivedNum,
            changeAmount,
            status: 'Lunas'
          };
        }

        if (tx && isFirebaseReady && db) {
          db.collection('transactions').doc(tx.id).set(tx).catch(e => console.warn("Tx write error:", e));
        } else if (tx) {
          setTransactions([tx, ...transactions.filter(t => t.id !== tx.id)]);
        }

        clearCart();
        setActivePendingTxId(null);
        setIsPayModalOpen(false);
        showToast('Transaksi berhasil diproses!');

        if (tx) {
          setCurrentTxToPrint(tx);
          setIsReceiptModalOpen(true);
        }
      };

      const processPendingPayment = (txId) => {
        const tx = transactions.find(t => t.id === txId);
        if (!tx) return;
        setActivePendingTxId(txId);
        setCart([...tx.items]);
        switchTab('pos');
        openPaymentModal();
      };

      const cancelPendingOrder = (txId) => {
        openDeleteModal(
          'Batalkan Pesanan Pending?',
          `Apakah Anda yakin ingin membatalkan pesanan ${txId}? Stok barang akan dikembalikan.`,
          () => {
            const tx = transactions.find(t => t.id === txId);
            if (!tx) return;

            const updatedProducts = products.map(p => {
              const item = tx.items.find(i => i.id === p.id);
              if (item) {
                const restoredStock = p.stock + item.qty;
                if (isFirebaseReady && db) {
                  db.collection('products').doc(p.id).update({ stock: restoredStock }).catch(e => console.warn("Stock update error:", e));
                }
                return { ...p, stock: restoredStock };
              }
              return p;
            });
            setProducts(updatedProducts);

            if (isFirebaseReady && db) {
              db.collection('transactions').doc(txId).delete().catch(e => console.warn("Tx delete error:", e));
            } else {
              setTransactions(transactions.filter(t => t.id !== txId));
            }
            showToast(`Pesanan ${txId} dibatalkan dan stok dikembalikan.`);
          }
        );
      };

      const deleteTransactionRecord = (txId) => {
        openDeleteModal(
          'Hapus Riwayat Penjualan?',
          `Apakah Anda yakin ingin menghapus data riwayat transaksi ${txId}? Tindakan ini tidak dapat dibatalkan.`,
          () => {
            if (isFirebaseReady && db) {
              db.collection('transactions').doc(txId).delete().catch(e => console.warn("Tx delete error:", e));
            } else {
              setTransactions(transactions.filter(t => t.id !== txId));
            }
            showToast(`Riwayat transaksi ${txId} berhasil dihapus.`);
          }
        );
      };

      const handleSaveProduct = (e) => {
        e.preventDefault();
        const formEl = e.target;
        const sku = formEl.prodSku.value.trim();
        const name = formEl.prodName.value.trim();
        const category = formEl.prodCategory.value;
        const buyPrice = parseFloat(formEl.prodBuyPrice.value) || 0;
        const sellPrice = parseFloat(formEl.prodSellPrice.value) || 0;
        const stock = parseInt(formEl.prodStock.value) || 0;

        const prodId = editingProd ? editingProd.id : Date.now().toString();
        const prodObj = { id: prodId, sku, name, category, buyPrice, sellPrice, stock };

        if (isFirebaseReady && db) {
          db.collection('products').doc(prodId).set(prodObj).catch(e => console.warn("Product write error:", e));
        } else {
          if (editingProd) {
            setProducts(products.map(p => p.id === prodId ? prodObj : p));
          } else {
            setProducts([...products, prodObj]);
          }
        }

        setIsProductModalOpen(false);
        setEditingProd(null);
        showToast(editingProd ? 'Produk berhasil diperbarui!' : 'Produk baru berhasil ditambahkan!');
      };

      const handleDeleteProduct = (prodId) => {
        openDeleteModal(
          'Hapus Produk?',

      const financialStats = useMemo(() => {

        const totalRevenue = paidTxs.reduce((sum, tx) => sum + (tx.totalPrice || 0), 0);
        const totalProfit = paidTxs.reduce((sum, tx) => sum + (tx.profit || 0), 0);
        
        const isCurrentYear = reportYear === new Date().getFullYear().toString();

        });

        const topProducts = Object.entries(productSales)
          .map(([name, data]) => ({ name, ...data }))
          .sort((a, b) => b.qty - a.qty);

      // Direct Web Bluetooth ESC/POS print for POS58B with standard window.print() fallback
      const printThermalReceipt = async () => {
        if (!currentTxToPrint) return;

        if (navigator.bluetooth) {
          try {
            showToast('Mencari printer Bluetooth POS58B...');
            const device = await navigator.bluetooth.requestDevice({
              filters: [
                { namePrefix: 'POS' },
                { namePrefix: 'POS58' },
                { namePrefix: 'POS58B' },
                { namePrefix: 'POS-58' },
                { namePrefix: 'RPP' },
                { namePrefix: 'BT' },
                { namePrefix: 'InnerPrinter' }
              ],
              optionalServices: [
                '000018f0-0000-1000-8000-00805f9b34fb',
                '0000ff00-0000-1000-8000-00805f9b34fb',
                '00004953-0000-1000-8000-00805f9b34fb',
                'e7810a71-73ae-499d-8c15-faa9aef0c3f2'
              ]
            }).catch(async () => {
              return await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                  '000018f0-0000-1000-8000-00805f9b34fb',
                  '0000ff00-0000-1000-8000-00805f9b34fb',
                  '00004953-0000-1000-8000-00805f9b34fb',
                  'e7810a71-73ae-499d-8c15-faa9aef0c3f2'
                ]
              });
            });

            if (device) {
              const server = await device.gatt.connect();
              const services = await server.getPrimaryServices();
              let characteristic = null;

              for (const service of services) {
                const chars = await service.getCharacteristics();
                for (const c of chars) {
                  if (c.properties.write || c.properties.writeWithoutResponse) {
                    characteristic = c;
                    break;
                  }
                }
                if (characteristic) break;
              }

              if (characteristic) {
                const encoder = new TextEncoder();
                let bytes = [];

                // Reset printer
                bytes.push(0x1B, 0x40);

                // Align Center
                bytes.push(0x1B, 0x61, 0x01);
                // Bold ON
                bytes.push(0x1B, 0x45, 0x01);
                bytes.push(...encoder.encode((settings.name || 'WARUNG AQILLA').toUpperCase() + '\n'));
                // Bold OFF
                bytes.push(0x1B, 0x45, 0x00);
                bytes.push(...encoder.encode((settings.address || '') + '\n'));
                bytes.push(...encoder.encode('Telp/WA: ' + (settings.phone || '') + '\n'));
                bytes.push(...encoder.encode('--------------------------------\n'));

                // Align Left
                bytes.push(0x1B, 0x61, 0x00);
                bytes.push(...encoder.encode('No: ' + currentTxToPrint.id + '\n'));
                bytes.push(...encoder.encode('Waktu: ' + new Date(currentTxToPrint.date).toLocaleString('id-ID') + '\n'));
                bytes.push(...encoder.encode('Pelanggan: ' + (currentTxToPrint.customerName || 'Pelanggan') + '\n'));
                bytes.push(...encoder.encode('Metode: ' + currentTxToPrint.paymentMethod + '\n'));
                bytes.push(...encoder.encode('--------------------------------\n'));

                currentTxToPrint.items.forEach(item => {
                  let name = item.name;
                  if (name.length > 32) name = name.substring(0, 32);
                  bytes.push(...encoder.encode(name + '\n'));

                  let qtyPrice = `${item.qty} x ${formatRupiah(item.sellPrice)}`;
                  let totalPrice = formatRupiah(item.sellPrice * item.qty);
                  let spaceCount = Math.max(1, 32 - qtyPrice.length - totalPrice.length);
                  bytes.push(...encoder.encode(qtyPrice + ' '.repeat(spaceCount) + totalPrice + '\n'));
                });

                bytes.push(...encoder.encode('--------------------------------\n'));

                // Total
                let totalLabel = 'TOTAL';
                let totalVal = formatRupiah(currentTxToPrint.totalPrice);
                let totalSpaces = Math.max(1, 32 - totalLabel.length - totalVal.length);
                bytes.push(...encoder.encode(totalLabel + ' '.repeat(totalSpaces) + totalVal + '\n'));

                if (currentTxToPrint.paymentMethod === 'Tunai') {
                  let cashLabel = 'Bayar Tunai';
                  let cashVal = formatRupiah(currentTxToPrint.cashReceived);
                  let cashSpaces = Math.max(1, 32 - cashLabel.length - cashVal.length);
                  bytes.push(...encoder.encode(cashLabel + ' '.repeat(cashSpaces) + cashVal + '\n'));

                  let changeLabel = 'Kembali';
                  let changeVal = formatRupiah(currentTxToPrint.changeAmount);
                  let changeSpaces = Math.max(1, 32 - changeLabel.length - changeVal.length);
                  bytes.push(...encoder.encode(changeLabel + ' '.repeat(changeSpaces) + changeVal + '\n'));
                }

                bytes.push(...encoder.encode('--------------------------------\n'));

                // Center Align Footer
                bytes.push(0x1B, 0x61, 0x01);
                bytes.push(...encoder.encode((settings.footerMsg || 'Terima kasih!') + '\n\n\n\n'));

                const uint8Array = new Uint8Array(bytes);
                const chunkSize = 20;
                for (let i = 0; i < uint8Array.length; i += chunkSize) {
                  const chunk = uint8Array.slice(i, i + chunkSize);
                  if (characteristic.properties.writeWithoutResponse) {
                    await characteristic.writeValueWithoutResponse(chunk);
                  } else {
                    await characteristic.writeValueWithResponse(chunk);
                  }
                }

                showToast('Struk berhasil dicetak ke Bluetooth POS58B!');
                device.gatt.disconnect();
                return;
              }
            }
          } catch (btErr) {
            console.warn("Bluetooth print canceled/fallback to browser print:", btErr);
          }
        }

        // Native browser print fallback
        window.print();

                                <tr key={idx} className="hover:bg-slate-50">
                                  <td className="p-3 font-bold text-slate-800">{u.username}</td>
                                  <td className="p-3 font-mono text-slate-500">••••••••</td>
                                  <td className="p-3 text-center">
                                    <div className="flex items-center justify-center gap-1.5">
                                      <button onClick={() => { setAdminForm({ index: idx, username: u.username, password: u.password }); setShowAdminPassword(false); }} className="p-1.5 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-lg text-xs font-bold" title="Edit Admin">
                                        <i className="fas fa-pen"></i>
                                      </button>
                                      {adminUsers.length > 1 && (
                                        <button onClick={() => handleDeleteAdminAccount(idx)} className="p-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-xs font-bold" title="Hapus Admin">
                                          <i className="fas fa-trash"></i>
                                        </button>
                                      )}
                                    </div>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* Modal Admin Login */}
          {isLoginModalOpen && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl border border-slate-200">
                <div className="p-5 bg-slate-900 text-white flex justify-between items-center">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-lg bg-amber-500 text-slate-900 flex items-center justify-center font-bold">
                      <i className="fas fa-user-shield"></i>
                    </div>
                    <div>
                      <h3 className="font-bold text-base">Login Admin</h3>
                      <p className="text-[11px] text-slate-400">Akses Dasbor Admin {settings.name}</p>
                    </div>
                  </div>
                  <button onClick={() => setIsLoginModalOpen(false)} className="text-slate-400 hover:text-white text-xl">&times;</button>
                </div>
                <form onSubmit={handleAdminLogin} className="p-5 space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Username Admin</label>
                    <input
                      type="text"
                      required
                      value={loginInput.username}
                      onChange={(e) => setLoginInput({ ...loginInput, username: e.target.value })}
                      className="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                    <div className="relative">
                      <input
                        type={showLoginPassword ? "text" : "password"}
                        required
                        value={loginInput.password}
                        onChange={(e) => setLoginInput({ ...loginInput, password: e.target.value })}
                        className="w-full px-3.5 py-2.5 pr-10 border border-slate-200 rounded-xl text-sm"
                      />
                      <button
                        type="button"
                        onClick={() => setShowLoginPassword(!showLoginPassword)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors p-1"
                        title={showLoginPassword ? "Sembunyikan Password" : "Tampilkan Password"}
                      >
                        <i className={`fas ${showLoginPassword ? 'fa-eye-slash' : 'fa-eye'} text-sm`}></i>
                      </button>
                    </div>
                  </div>
                  <button type="submit" className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md flex items-center justify-center gap-2">
                    <i className="fas fa-right-to-bracket"></i>
                    <span>Masuk ke Dasbor Admin</span>
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Payment Modal */}
          {isPayModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
                <div className="p-5 bg-slate-900 text-white flex justify-between items-center">
                  <h3 className="font-bold text-lg">Pembayaran Penjualan</h3>
                  <button onClick={() => setIsPayModalOpen(false)} className="text-slate-400 hover:text-white text-xl">&times;</button>
                </div>
                <div className="p-5 space-y-4">
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center">
                    <span className="text-xs text-slate-500 font-medium">Total Pembayaran</span>
                    <div className="text-3xl font-black text-emerald-600">{formatRupiah(cartTotal)}</div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1.5">Metode Pembayaran</label>
                    <div className="grid grid-cols-3 gap-2">
                      {['Tunai', 'QRIS', 'Transfer'].map(method => (
                        <button
                          key={method}
                          type="button"
                          onClick={() => setSelectedPayMethod(method)}
                          className={`py-2 font-bold rounded-xl text-xs border ${selectedPayMethod === method ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-slate-200 text-slate-600'}`}
                        >
                          {method}
                        </button>
                      ))}
                    </div>
                  </div>

                  {selectedPayMethod === 'Tunai' && (
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Jumlah Uang Diterima (Rp)</label>
                      <input
                        type="number"
                        value={cashAmount}
                        onChange={(e) => setCashAmount(e.target.value)}
                        placeholder="0"
                        className="w-full px-4 py-3 text-lg font-bold border border-slate-200 rounded-xl"
                      />
                      <div className="grid grid-cols-4 gap-1.5 mt-2">
                        <button onClick={() => setCashAmount(cartTotal.toString())} className="py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700">Uang Pas</button>
                        <button onClick={() => setCashAmount('10000')} className="py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700">10.000</button>
                        <button onClick={() => setCashAmount('20000')} className="py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700">20.000</button>
                        <button onClick={() => setCashAmount('50000')} className="py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700">50.000</button>
                        <button onClick={() => setCashAmount('100000')} className="py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs font-semibold text-slate-700 col-span-2">100.000</button>
                      </div>
                    </div>
                  )}

                  <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-100 flex justify-between items-center">
                    <span className="text-xs font-semibold text-emerald-800">Kembalian</span>
                    <span className="text-xl font-bold text-emerald-700">
                      {selectedPayMethod === 'Tunai' ? formatRupiah(Math.max(0, (parseFloat(cashAmount) || 0) - cartTotal)) : 'Rp 0'}
                    </span>
                  </div>

                  <button onClick={processTransaction} className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg flex items-center justify-center gap-2">
                    <i className="fas fa-print"></i>
                    <span>Proses & Cetak Struk</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Add / Edit Product Modal */}
          {isProductModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl">
                <div className="p-5 bg-slate-900 text-white flex justify-between items-center">
                  <h3 className="font-bold text-lg">{editingProd ? 'Edit Produk' : 'Tambah Produk Baru'}</h3>
                  <button onClick={() => setIsProductModalOpen(false)} className="text-slate-400 hover:text-white text-xl">&times;</button>
                </div>
                <form onSubmit={handleSaveProduct} className="p-5 space-y-3.5">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Kode SKU / Barcode</label>
                    <input name="prodSku" type="text" required defaultValue={editingProd ? editingProd.sku : 'PRD-' + Math.floor(1000 + Math.random() * 9000)} className="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Nama Produk</label>
                    <input name="prodName" type="text" required defaultValue={editingProd ? editingProd.name : ''} className="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Jenis / Kategori Produk</label>
                    <div className="flex gap-2">
                      <select name="prodCategory" required defaultValue={editingProd ? editingProd.category : categories[0]} className="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm bg-white font-medium">
                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                      <button type="button" onClick={() => setIsCategoryModalOpen(true)} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs flex items-center gap-1 shrink-0">
                        <i className="fas fa-plus text-[10px]"></i> Baru
                      </button>
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Harga Beli / Modal</label>
                      <input name="prodBuyPrice" type="number" min="0" required defaultValue={editingProd ? editingProd.buyPrice : ''} className="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Harga Jual</label>
                      <input name="prodSellPrice" type="number" min="0" required defaultValue={editingProd ? editingProd.sellPrice : ''} className="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Stok Awal</label>
                    <input name="prodStock" type="number" min="0" required defaultValue={editingProd ? editingProd.stock : 0} className="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-sm" />
                  </div>
                  <button type="submit" className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md mt-2">
                    Simpan Produk
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Restock Modal */}
          {isRestockModalOpen && restockProd && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl">
                <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                  <h3 className="font-bold text-base">Tambah Stok Barang</h3>
                  <button onClick={() => setIsRestockModalOpen(false)} className="text-slate-400 hover:text-white text-xl">&times;</button>
                </div>
                <form onSubmit={handleSaveRestock} className="p-5 space-y-4">
                  <div>
                    <span className="text-xs text-slate-500">Nama Produk</span>
                    <div className="font-bold text-slate-800 text-base">{restockProd.name} ({restockProd.sku})</div>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Jumlah Tambahan Stok</label>
                    <input
                      type="number"
                      min="1"
                      required
                      value={restockQty}
                      onChange={(e) => setRestockQty(e.target.value)}
                      placeholder="Masukkan Qty..."
                      className="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm font-bold"
                    />
                  </div>
                  <button type="submit" className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md">
                    Tambah Stok Sekarang
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Manage Categories Modal */}
          {isCategoryModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl">
                <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                  <h3 className="font-bold text-base">Kelola Jenis / Kategori</h3>
                  <button onClick={() => setIsCategoryModalOpen(false)} className="text-slate-400 hover:text-white text-xl">&times;</button>
                </div>
                <div className="p-5 space-y-4">
                  <form onSubmit={handleAddCategory} className="space-y-2">
                    <label className="block text-xs font-semibold text-slate-700">Tambah Jenis Baru</label>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        required
                        value={newCatInput}
                        onChange={(e) => setNewCatInput(e.target.value)}
                        placeholder="Contoh: Sembako, Bumbu..."
                        className="w-full px-3.5 py-2 border border-slate-200 rounded-xl text-xs"
                      />
                      <button type="submit" className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shrink-0">
                        Tambah
                      </button>
                    </div>
                  </form>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-2">Daftar Jenis Saat Ini</label>
                    <div className="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto p-1 bg-slate-50 rounded-xl border border-slate-100">
                      {categories.map(c => (
                        <span key={c} className="inline-flex items-center gap-1.5 px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 shadow-sm">
                          <span>{c}</span>
                          {categories.length > 1 && (
                            <button onClick={() => handleDeleteCategory(c)} className="text-slate-400 hover:text-rose-500 font-bold ml-1">&times;</button>
                          )}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Thermal Receipt Preview Modal (Pratinjau Struk) */}
          {isReceiptModalOpen && currentTxToPrint && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
                <div className="p-4 bg-slate-900 text-white flex justify-between items-center shrink-0">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <i className="fas fa-receipt text-emerald-400"></i>
                    <span>Pratinjau Struk Pembayaran</span>
                  </h3>
                  <button onClick={() => setIsReceiptModalOpen(false)} className="text-slate-400 hover:text-white text-xl">&times;</button>
                </div>
                
                <div className="p-4 overflow-y-auto bg-slate-100 flex-1">
                  <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 font-mono text-xs text-slate-900 space-y-3">
                    <div className="text-center">
                      <div className="font-bold text-sm">{settings.name}</div>
                      <div className="text-[10px] text-slate-600">{settings.address}</div>
                      <div className="text-[10px] text-slate-600">Telp/WA: {settings.phone}</div>
                    </div>
                    <div className="border-t border-dashed border-slate-400 my-1"></div>
                    <div className="text-[10px] space-y-0.5">
                      <div>No: {currentTxToPrint.id}</div>
                      <div>Waktu: {new Date(currentTxToPrint.date).toLocaleString('id-ID')}</div>
                      <div>Pelanggan: {currentTxToPrint.customerName || 'Pelanggan'}</div>
                      <div>Metode: {currentTxToPrint.paymentMethod}</div>
                    </div>
                    <div className="border-t border-dashed border-slate-400 my-1"></div>
                    <div className="space-y-1">
                      {currentTxToPrint.items.map((item, idx) => (
                        <div key={idx} className="flex justify-between">
                          <span className="font-bold">{item.name} x{item.qty}</span>
                          <span>{formatRupiah(item.sellPrice * item.qty)}</span>
                        </div>
                      ))}
                    </div>
                    <div className="border-t border-dashed border-slate-400 my-1"></div>
                    <div className="font-bold flex justify-between text-sm">
                      <span>TOTAL</span>
                      <span>{formatRupiah(currentTxToPrint.totalPrice)}</span>
                    </div>
                    {currentTxToPrint.paymentMethod === 'Tunai' && (
                      <div className="text-[10px] space-y-0.5">
                        <div className="flex justify-between">
                          <span>Bayar Tunai</span>
                          <span>{formatRupiah(currentTxToPrint.cashReceived)}</span>
                        </div>
                        <div className="flex justify-between">
                          <span>Kembali</span>
                          <span>{formatRupiah(currentTxToPrint.changeAmount)}</span>
                        </div>
                      </div>
                    )}
                    <div className="border-t border-dashed border-slate-400 my-1"></div>
                    <div className="text-center text-[10px] whitespace-pre-line text-slate-600">
                      {settings.footerMsg}
                    </div>
                  </div>
                </div>

                <div className="p-4 bg-white border-t border-slate-200 flex gap-2 shrink-0">
                  <button onClick={() => setIsReceiptModalOpen(false)} className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">
                    Tutup
                  </button>
                  <button onClick={printThermalReceipt} className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-md flex items-center justify-center gap-1.5">
                    <i className="fas fa-print"></i>
                    <span>Cetak Struk POS58B</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Delete Confirmation Modal */}
          {deleteModal.isOpen && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl border border-slate-200">
                <div className="p-4 bg-rose-600 text-white flex justify-between items-center">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <i className="fas fa-triangle-exclamation"></i>
                    <span>{deleteModal.title}</span>
                  </h3>
                  <button onClick={() => setDeleteModal({ isOpen: false, title: '', message: '', onConfirm: null })} className="text-rose-200 hover:text-white text-xl">&times;</button>
                </div>
                <div className="p-5 space-y-4">
                  <p className="text-xs text-slate-600 leading-relaxed">{deleteModal.message}</p>
                  <div className="flex gap-2">
                    <button
                      onClick={() => setDeleteModal({ isOpen: false, title: '', message: '', onConfirm: null })}
                      className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs"
                    >
                      Batal
                    </button>
                    <button
                      onClick={deleteModal.onConfirm}
                      className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs shadow-md"
                    >
                      Ya, Hapus
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Hidden Thermal Receipt Element for Native Browser Print */}
          {currentTxToPrint && (
            <div id="printable-thermal-receipt" className="hidden">
              <div style={{ width: settings.paperWidth === '80mm' ? '76mm' : '54mm', margin: '0 auto', padding: '8px', fontFamily: 'monospace', fontSize: '11px', lineHeight: '1.2' }}>
                <div style={{ textAlign: 'center', marginBottom: '8px' }}>
                  <div style={{ fontWeight: 'bold', fontSize: '14px' }}>{settings.name}</div>
                  <div style={{ fontSize: '10px' }}>{settings.address}</div>
                  <div style={{ fontSize: '10px' }}>Telp/WA: {settings.phone}</div>
                </div>
                <div style={{ borderTop: '1px dashed #000', margin: '6px 0' }}></div>
                <div style={{ fontSize: '10px', marginBottom: '6px' }}>
                  <div>No: {currentTxToPrint.id}</div>
                  <div>Waktu: {new Date(currentTxToPrint.date).toLocaleString('id-ID')}</div>
                  <div>Pelanggan: {currentTxToPrint.customerName || 'Pelanggan'}</div>
                  <div>Metode: {currentTxToPrint.paymentMethod}</div>
                </div>
                <div style={{ borderTop: '1px dashed #000', margin: '6px 0' }}></div>
                <div style={{ fontSize: '11px', marginBottom: '6px' }}>
                  {currentTxToPrint.items.map((item, idx) => (
                    <div key={idx} style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '2px' }}>
                      <span style={{ fontWeight: 'bold' }}>{item.name} x{item.qty}</span>
                      <span>{formatRupiah(item.sellPrice * item.qty)}</span>
                    </div>
                  ))}
                </div>
                <div style={{ borderTop: '1px dashed #000', margin: '6px 0' }}></div>
                <div style={{ fontSize: '11px', fontWeight: 'bold', display: 'flex', justifyContent: 'space-between' }}>
                  <span>TOTAL</span>
                  <span>{formatRupiah(currentTxToPrint.totalPrice)}</span>
                </div>
                {currentTxToPrint.paymentMethod === 'Tunai' && (
                  <div style={{ fontSize: '10px', display: 'flex', justifyContent: 'space-between', marginTop: '2px' }}>
                    <span>Bayar Tunai</span>
                    <span>{formatRupiah(currentTxToPrint.cashReceived)}</span>
                  </div>
                )}
                {currentTxToPrint.paymentMethod === 'Tunai' && (
                  <div style={{ fontSize: '10px', display: 'flex', justifyContent: 'space-between' }}>
                    <span>Kembali</span>
                    <span>{formatRupiah(currentTxToPrint.changeAmount)}</span>
                  </div>
                )}
                <div style={{ borderTop: '1px dashed #000', margin: '8px 0 4px 0' }}></div>
                <div style={{ textAlign: 'center', fontSize: '10px' }}>
                  {settings.footerMsg}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
